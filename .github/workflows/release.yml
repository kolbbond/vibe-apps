name: Release

# Push a tag vX.Y.Z (matching project(VERSION) in CMakeLists.txt) to build the
# Linux and Windows packages and attach them to a *draft* GitHub release.
# Run it by hand (Actions -> Release -> Run workflow) for a dry run: the packages
# are built and kept as workflow artifacts, nothing is released.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # the vibe engine release these apps build against (keep in sync with ci.yml and README.md)
  VIBE_REF: v0.002.5

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read project version (and check it matches the tag)
        id: v
        run: |
          version=$(sed -nE 's/^project\(vibe-apps VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          test -n "$version" || { echo "::error::no project(VERSION) in CMakeLists.txt"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match CMakeLists.txt version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out vibe-apps
        uses: actions/checkout@v4
        with:
          path: vibe-apps

      - name: Check out vibe engine
        uses: actions/checkout@v4
        with:
          repository: kolbbond/vibe
          ref: ${{ env.VIBE_REF }}
          submodules: recursive
          path: vibe
          # while kolbbond/vibe is private, set a read-only token as VIBE_REPO_TOKEN
          token: ${{ secrets.VIBE_REPO_TOKEN || github.token }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gfortran cmake ninja-build pkg-config \
            libboost-filesystem-dev libboost-iostreams-dev libtclap-dev \
            libgl-dev libsdl2-dev libncurses-dev libfftw3-dev \
            libavformat-dev libavcodec-dev libswresample-dev libavutil-dev \
            libasound2-dev libpulse-dev libjack-jackd2-dev \
            imagemagick file

      # same key as ci.yml, so a release reuses the CI's deps build
      - name: Cache vibe third-party deps
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: vibe/.deps/usr
          key: vibe-deps-${{ runner.os }}-ubuntu-24.04-${{ env.VIBE_REF }}-${{ hashFiles('vibe/deps/**') }}

      - name: Build vibe deps
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: make -C vibe deps PARALLEL="--parallel $(nproc)"

      - name: Build and test
        working-directory: vibe-apps
        run: |
          make PARALLEL="--parallel $(nproc)"
          make test

      # vvavviz + presets + engine/deps libs under lib/vibe (system libs not included)
      - name: Package tarball
        run: |
          mkdir -p dist
          (cd vibe-apps/build && cpack -G TGZ -B "$GITHUB_WORKSPACE/cpack")
          cp cpack/*.tar.gz dist/

      # self-contained: also bundles SDL2, FFmpeg, Boost, FFTW, ... from the build machine
      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          cmake --install vibe-apps/build --prefix AppDir/usr
          # icon: the planet panel of the README screenshot
          convert vibe-apps/docs/vvavviz.png -gravity East -crop 600x600+5+0 +repage \
                  -resize 256x256 vvavviz.png
          cat > vvavviz.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=vvavviz
          Comment=Music visualizer and music-driven fluid plasma
          Exec=vvavviz
          Icon=vvavviz
          Categories=AudioVideo;Audio;
          EOF
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          export LD_LIBRARY_PATH="$PWD/AppDir/usr/lib/vibe"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable AppDir/usr/bin/vvavviz \
            --desktop-file vvavviz.desktop --icon-file vvavviz.png
          # the Ubuntu copyright file of every system library linuxdeploy bundled
          for so in AppDir/usr/lib/*.so*; do
            pkg=$(dpkg -S "*/$(basename "$so")" 2>/dev/null | head -1 | cut -d: -f1) || true
            if [[ -n "$pkg" && -f "/usr/share/doc/$pkg/copyright" ]]; then
              install -Dm644 "/usr/share/doc/$pkg/copyright" "AppDir/usr/share/doc/$pkg/copyright"
            fi
          done
          echo "copyright files: $(find AppDir/usr/share/doc -name copyright | wc -l)"
          OUTPUT="dist/vvavviz-${VERSION}-x86_64.AppImage" ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir --output appimage

      - name: Smoke test packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          ls -lh dist
          "dist/vvavviz-${VERSION}-x86_64.AppImage" --help | head -3
          mkdir t && tar -xzf dist/*.tar.gz -C t && "$(find t -path '*/bin/vvavviz')" --help | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: vvavviz-linux
          path: dist/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
      VCPKG_PACKAGES: >-
        boost-filesystem boost-iostreams sdl2 ffmpeg fftw3 tclap
        openblas lapack pkgconf
    steps:
      - name: Check out vibe-apps
        uses: actions/checkout@v4
        with:
          path: vibe-apps

      - name: Check out vibe engine
        uses: actions/checkout@v4
        with:
          repository: kolbbond/vibe
          ref: ${{ env.VIBE_REF }}
          submodules: recursive
          path: vibe
          token: ${{ secrets.VIBE_REPO_TOKEN || github.token }}

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # msvc-dev-cmd points VCPKG_ROOT at Visual Studio's bundled vcpkg (no classic mode)
      - name: Use standalone vcpkg
        shell: pwsh
        run: '"VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV'

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vibe-apps/.github/workflows/release.yml') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install vcpkg packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_ROOT\vcpkg.exe" install $env:VCPKG_PACKAGES.Split(' ')

      - name: Cache vibe third-party deps
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: vibe/.deps/usr
          key: vibe-deps-${{ runner.os }}-${{ env.VIBE_REF }}-${{ hashFiles('vibe/deps/**') }}

      - name: Build vibe deps
        if: steps.deps-cache.outputs.cache-hit != 'true'
        working-directory: vibe
        run: |
          cmake --preset windows-vcpkg -S deps
          cmake --build .deps --parallel

      - name: Build and test
        working-directory: vibe-apps
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo `
                -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      # NSIS installer + zip (CPack config in CMakeLists.txt; NSIS is on the runner)
      - name: Package
        working-directory: vibe-apps/build
        run: cpack -B "${{ github.workspace }}\dist"

      - name: Smoke test zip
        shell: pwsh
        run: |
          Get-ChildItem dist
          Expand-Archive (Get-ChildItem dist\*.zip).FullName -DestinationPath t
          $exe = (Get-ChildItem t -Recurse -Filter vvavviz.exe).FullName
          & $exe --help | Select-Object -First 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: vvavviz-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  # Windows does not block a release: if it fails, the draft goes out with the Linux files only
  publish:
    if: always() && github.ref_type == 'tag' && needs.linux.result == 'success'
    needs: [version, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # a draft: check the files, then press Publish on GitHub
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: vvavviz ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
          body: |
            Prebuilt vvavviz ${{ needs.version.outputs.version }}, built against vibe ${{ env.VIBE_REF }}.

            - **Linux**: `vvavviz-*-x86_64.AppImage` runs on its own (`chmod +x`, then run it).
              The `.tar.gz` needs SDL2, FFmpeg, Boost and FFTW from your distro.
            - **Windows**: the `.exe` installer, or unzip the `.zip` and run `bin\vvavviz.exe`.

            The source is MIT. These packages bundle GPL libraries (FFTW, and FFmpeg's codecs on
            Linux), so the packages are distributed under GPL-2.0-or-later. See
            `share/doc/vvavviz/THIRD-PARTY-NOTICES.md` in each package.
